    .apl-metrics button.static{cursor:default}

    .apl-group.open{background:var(--input)}

    .apl-group.open .apl-animal{background:transparent}

    .apl-group.open .apl-caret{color:var(--orange-dark)}

    .apl-applicant .avatar{width:36px;height:36px;font-size:11px}
    .apl-applicant-name b{display:block;font-size:13px}
    .apl-applicant-name small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
