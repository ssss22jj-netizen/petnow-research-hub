<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petify for Shelters — Interactive Pretotype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="styles.css?v=20260810-8">
  <style>
    .foster-form-page{min-height:100vh!important}
    .submission b em.review{color:var(--amber);background:var(--amber-soft)}
    .submission b em.failed{color:var(--red);background:var(--red-soft)}
    .submission b em.complete{color:var(--green);background:var(--green-soft)}
    .submission i.failed{color:var(--red)}
    .submission i.complete{color:var(--green)}
    .change-summary.alert{background:var(--red-soft);border-color:#f3c7c4}
    .change-summary.alert>span,.change-summary.alert button{color:var(--red)}
    .change-summary.success{background:var(--green-soft);border-color:#cceadd}
    .change-summary.success>span,.change-summary.success button{color:var(--green)}
    .comparison>div.new.approved{border-color:#bfe5d7;background:var(--green-soft)}
    .review-actions.resolved{grid-template-columns:auto 1fr auto auto}
    .message-drawer{overflow:auto}
    .message-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--input);border-radius:11px;padding:4px;margin:20px 0 14px}
    .message-tabs button{border:0;background:transparent;border-radius:8px;padding:9px;color:var(--muted);font-weight:650}
    .message-tabs button.active{background:#fff;color:var(--orange-dark);box-shadow:0 1px 4px rgba(44,47,52,.08)}
    .phone-preview{width:280px;margin:0 auto 16px;border:7px solid var(--ink);border-radius:28px;background:#eef1f4;padding:0 10px 11px;overflow:hidden}
    .phone-preview-bar{display:grid;grid-template-columns:20px 1fr 24px;align-items:center;text-align:center;background:#fff;margin:0 -10px 12px;padding:12px 10px 9px}
    .phone-preview-bar b,.phone-preview-bar small{display:block}.phone-preview-bar small{font-size:9px;color:var(--muted);margin-top:2px}.phone-preview-bar i{font-style:normal;color:var(--muted)}
    .message-time{text-align:center;font-size:9px;color:var(--muted);margin-bottom:8px}
    .sms-bubble{background:#fff;border-radius:15px 15px 15px 4px;padding:12px;font-size:11px;line-height:1.45;box-shadow:0 1px 2px rgba(44,47,52,.06)}
    .sms-bubble strong{color:var(--blue)}.sms-bubble small{color:var(--muted)}
    .sms-input{margin-top:12px;background:#fff;border-radius:999px;padding:8px 9px 8px 12px;color:var(--muted);font-size:10px}.sms-input span{float:right;background:var(--orange);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
    .email-preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;background:#fff}
    .email-meta{background:var(--input);padding:11px 13px;display:grid;gap:7px}.email-meta span{display:grid;grid-template-columns:42px 1fr;align-items:center}.email-meta small{font-size:8px;color:var(--muted)}.email-meta b{font-size:10px}
    .email-body{padding:20px;text-align:center}.email-body>.brand-mark{transform:scale(.65);margin:0 auto 7px}.email-body h3{font-size:18px;margin:5px 0 8px}.email-body>p:not(.kicker){font-size:11px}.email-body>button{border:0;background:var(--orange);color:#fff;border-radius:9px;padding:11px 16px;font-weight:700;margin:15px 0 10px}.email-body>small{display:block;color:var(--muted);font-size:9px}
    .delivery-details{display:grid;gap:8px;margin:16px 0}.delivery-details>div{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start;background:var(--input);padding:11px;border-radius:10px}.delivery-details>div>span{width:27px;height:27px;background:#fff;border-radius:8px;display:grid;place-items:center;color:var(--orange-dark)}.delivery-details b{display:block;color:var(--ink);font-size:11px}.delivery-details p{font-size:10px}
    .preview-flow{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:15px}.preview-flow>small{font-size:8px;color:var(--muted);font-weight:800;letter-spacing:.09em}.preview-flow>div{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.preview-flow span{display:flex;align-items:center;gap:5px;font-size:9px}.preview-flow span i{width:19px;height:19px;border-radius:50%;background:var(--orange-soft);color:var(--orange-dark);display:grid;place-items:center;font-style:normal;font-weight:800}.preview-flow em{font-style:normal;color:var(--muted-2)}.preview-flow p{font-size:9px}
    .tutorial-launch{height:42px;border:1px solid #ffd4c7;background:var(--orange-pale);color:var(--orange-dark);border-radius:12px;padding:0 13px 0 9px;display:flex;align-items:center;gap:7px;font-weight:700}
    .tutorial-launch:hover{border-color:var(--orange);background:var(--orange-soft)}
    .tutorial-launch>span{width:24px;height:24px;border-radius:8px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800}
    .tutorial-layer{position:fixed;inset:0;z-index:300;pointer-events:none}
    .tutorial-dim{position:fixed;background:rgba(31,33,37,.10);pointer-events:auto}
    .tutorial-highlight{position:fixed;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 3px var(--orange),0 0 0 8px rgba(255,89,44,.22);pointer-events:auto;background:transparent;padding:0;animation:tutorialPulse 1.5s ease-in-out infinite}
    .tutorial-highlight.interactive{cursor:pointer}
    .tutorial-card{position:fixed;visibility:hidden;background:#fff;border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:18px;box-shadow:0 22px 65px rgba(18,20,24,.28);pointer-events:auto}
    .tutorial-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
    .tutorial-card-head>span{font-size:9px;color:var(--orange-dark);font-weight:850;letter-spacing:.12em}
    .tutorial-card-head>button{width:28px;height:28px;border:0;border-radius:50%;background:var(--input);color:var(--muted);font-size:17px}
    .tutorial-card>small{font-size:9px;color:var(--muted);font-weight:700}
    .tutorial-card>h3{font-size:19px;margin:6px 0 7px}
    .tutorial-card>p{font-size:12px}
    .tutorial-card-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:16px;padding-top:13px}
    .tutorial-card-actions>span{color:var(--orange-dark);font-size:10px;font-weight:700}
    .tutorial-exit{border:0;background:transparent;color:var(--muted);font-size:10px;padding:7px 0}
    .tutorial-next{border:0;background:var(--orange);color:#fff;border-radius:9px;padding:9px 13px;font-size:11px;font-weight:700}
    .guide-drawer{overflow:auto}
    .tutorial-picker{display:grid;gap:11px;margin:22px 0 16px}
    .tutorial-option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;display:block;width:100%}
    .tutorial-option:hover{border-color:#ffb8a3;background:var(--orange-pale);transform:translateY(-1px)}
    .tutorial-option small,.tutorial-option b,.tutorial-option span,.tutorial-option em{display:block}
    .tutorial-option small{color:var(--orange-dark);font-size:9px;font-weight:800;letter-spacing:.09em}
    .tutorial-option b{font-size:16px;margin:7px 0 5px}
    .tutorial-option span{color:var(--muted);font-size:10px;line-height:1.45}
    .tutorial-option em{color:var(--orange-dark);font-size:11px;font-weight:750;font-style:normal;margin-top:13px}
    .guide-note{background:var(--input);border-radius:12px;padding:13px}
    .guide-note b{display:block;font-size:11px;margin-bottom:4px}.guide-note p{font-size:10px}
    .request-waiting{display:grid;grid-template-columns:36px 1fr;gap:11px;align-items:center;background:var(--blue-soft);border:1px solid #d8e6f7;border-radius:13px;padding:14px;margin-bottom:14px}
    .request-waiting>span{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:16px}
    .request-waiting b{display:block;margin-bottom:3px}.request-waiting p{font-size:10px}
    .request-due{display:grid;grid-template-columns:36px 1fr;gap:11px;align-items:center;background:var(--amber-soft);border:1px solid #f3dfb9;border-radius:13px;padding:14px;margin-bottom:14px}
    .request-due>span{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--amber);display:grid;place-items:center;font-size:16px;font-weight:800}
    .request-due b{display:block;margin-bottom:3px}.request-due p{font-size:10px}
    .request-delivery-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px}
    .request-delivery-grid>div{padding:14px;border-right:1px solid var(--line)}.request-delivery-grid>div:last-child{border-right:0}
    .request-delivery-grid small,.request-delivery-grid b,.request-delivery-grid em{display:block}.request-delivery-grid small{color:var(--muted);font-size:8px;letter-spacing:.07em}.request-delivery-grid b{margin:7px 0 4px;font-size:12px}.request-delivery-grid em{font-style:normal;color:var(--muted);font-size:9px}
    .request-link-row{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:13px;padding:15px}
    .request-link-row small,.request-link-row b{display:block}.request-link-row small{font-size:8px;color:var(--muted);letter-spacing:.07em}.request-link-row b{margin:5px 0;color:var(--blue)}.request-link-row p{font-size:10px}
    @keyframes tutorialPulse{0%,100%{box-shadow:0 0 0 3px var(--orange),0 0 0 8px rgba(255,89,44,.18)}50%{box-shadow:0 0 0 3px var(--orange),0 0 0 12px rgba(255,89,44,.08)}}
    @media(max-width:680px){.tutorial-launch{width:40px;padding:0;justify-content:center;font-size:0}.tutorial-launch>span{background:transparent;color:var(--orange-dark);font-size:12px}.tutorial-card{border-radius:14px}.tutorial-card-actions>span{max-width:150px;text-align:right}.request-delivery-grid{grid-template-columns:1fr 1fr}.request-delivery-grid>div{border-bottom:1px solid var(--line)}.request-link-row{align-items:stretch;flex-direction:column}.metric-context,.update-context{display:block}.metric-context>small,.update-context>small{display:block;margin-top:4px}.active-filters>small{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=20260810-11"></script>
</body>
</html>
